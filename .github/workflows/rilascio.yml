# Crea la release dell'app quando nel ramo "rilasci" arriva una nuova APK.
# Il ramo contiene solo MissaleRomanum.apk e rilascio.json (tag, titolo, note).
name: Pubblica versione

on:
  push:
    branches: [rilasci]

permissions:
  contents: write

jobs:
  rilascio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(jq -r .tag rilascio.json)
          jq -r .note rilascio.json > note.md
          gh release create "$TAG" MissaleRomanum.apk \
            --title "$(jq -r .titolo rilascio.json)" --notes-file note.md \
            --target main --latest
